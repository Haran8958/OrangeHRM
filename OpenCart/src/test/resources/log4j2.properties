status = warn
name = PropertiesConfig

property.logDir = ${sys:user.dir}/logs
property.logFile = ${logDir}/automation.log

# Console Appender
appender.console.type = Console
appender.console.name = Console

appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level %c{1} - %msg%n


# File Appender
appender.file.type = File
appender.file.name = File

appender.file.fileName = ${logFile}
appender.file.append = true

appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5level %c{1} - %msg%n


# Root Logger
rootLogger.level = info

rootLogger.appenderRefs = console, file

rootLogger.appenderRef.console.ref = Console
rootLogger.appenderRef.file.ref = File